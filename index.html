.brand .an{font-family:var(--geo);font-size:16px;font-weight:600;letter-spacing:.01em;color:var(--ink-950);line-height:1.1}
.brand .fm{font-family:var(--geo);font-size:9px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-400);margin-top:3px}
.nsec{display:flex;align-items:center;font-family:var(--geo);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.14em;color:var(--ink-400);padding:12px 18px 5px}
.nsec .acts{margin-left:auto;display:flex;gap:2px}
.iconbtn{width:24px;height:24px;border:none;background:transparent;border-radius:7px;color:var(--ink-300);cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--ink-100);color:var(--ink-600)}
.iconbtn svg{width:15px;height:15px}
.tree{flex:1;overflow:auto;padding:2px 10px}
.node-h{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--ink-700);font-size:13.5px;font-weight:500;user-select:none}
.node-h:hover{background:var(--ink-50)}
.node-h.sel{background:var(--ink-100);color:var(--ink-950);font-weight:600}
.node-h.drop{background:var(--ocre-50,#FDF4E9);box-shadow:inset 0 0 0 1.5px var(--ocre)}
.node-h.dh-into{background:var(--ocre-50,#FDF4E9);box-shadow:inset 0 0 0 1.5px var(--ocre)}
.node-h.dh-before{box-shadow:inset 0 2px 0 0 var(--ocre)}
.node-h.dh-after{box-shadow:inset 0 -2px 0 0 var(--ocre)}
.node-h.dragging{opacity:.45}
.node-h[draggable=true]{cursor:grab}
.dot{width:8px;height:8px;border-radius:99px;flex-shrink:0;background:var(--ink-300);cursor:pointer}
.node-t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.node-t[contenteditable=true]{box-shadow:0 0 0 2px var(--ink-200);border-radius:6px;padding:0 4px}
.kids{margin-left:15px}
.side-b{border-top:1px solid var(--ink-100);padding:10px 12px;display:flex;gap:8px}
.side-b .lk{flex:1;text-align:center;border:1px solid var(--ink-200);border-radius:9px;background:#fff;padding:8px;font-size:12px;font-weight:500;color:var(--ink-600);cursor:pointer}
.side-b .lk:hover{background:var(--ink-50)}
.user{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--ink-100)}
.user .av{width:32px;height:32px;border-radius:99px;background:var(--grafito);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.user .un{font-size:12.5px;font-weight:600}.user .ur{font-family:var(--geo);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-400)}
/* CONTENT */
.main{grid-column:2;grid-row:1;overflow:auto;padding:26px 30px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.eyebrow{font-family:var(--geo);text-transform:uppercase;font-size:10px;font-weight:600;letter-spacing:.18em;color:var(--ink-400)}
.ptitle{font-family:var(--geo);text-transform:uppercase;font-size:22px;font-weight:600;letter-spacing:.13em;color:var(--ink-950);margin-top:5px}
.ul{height:2px;width:28px;background:var(--ocre);border-radius:2px;margin-top:9px}
.psub{margin-top:9px;color:var(--ink-500);font-size:13.5px}
.pr{display:flex;align-items:center;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-400)}
.search input{width:280px;padding:10px 12px 10px 33px;border:1px solid var(--ink-200);border-radius:9px;background:#fff;font-size:13px;color:var(--ink-800);outline:none}
.search input:focus{box-shadow:0 0 0 2px var(--ink-200);border-color:var(--ink-300)}
.btnp{display:inline-flex;align-items:center;gap:8px;background:var(--ink-600);color:#fff;border:none;border-radius:9px;padding:11px 16px;font-family:var(--geo);font-weight:500;font-size:12.5px;text-transform:uppercase;letter-spacing:.07em;cursor:pointer}
.btnp:hover{background:var(--ink-700)}.btnp svg{width:15px;height:15px}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.count{font-family:var(--geo);text-transform:uppercase;font-size:10.5px;font-weight:600;letter-spacing:.1em;color:var(--ink-600);background:var(--ink-100);border-radius:99px;padding:4px 11px}
.path{font-family:var(--mono);font-size:12px;color:var(--ink-400)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--ink-200);border-radius:12px;padding:13px;min-height:196px;display:flex;flex-direction:column;box-shadow:var(--sombra);cursor:grab;transition:border-color .15s}
.card:hover{border-color:var(--ink-300)}
.card.drag{opacity:.5}
.card h3{font-size:14px;font-weight:600;color:var(--ink-900);margin-bottom:7px;outline:none;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card h3[contenteditable=true]{-webkit-line-clamp:unset;box-shadow:0 0 0 2px var(--ink-200);border-radius:6px;padding:2px 4px}
.card p{font-size:12.5px;line-height:1.45;color:var(--ink-500);flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;outline:none}
.card p[contenteditable=true]{-webkit-line-clamp:unset;box-shadow:0 0 0 2px var(--ink-200);border-radius:6px;padding:2px 4px}
.card .row{display:flex;align-items:center;gap:7px;margin-top:9px}
.star,.copy,.trash{border:1px solid var(--ink-200);border-radius:8px;background:#fff;cursor:pointer;color:var(--ink-400)}
.star,.trash{width:28px;height:28px;display:flex;align-items:center;justify-content:center}
.star svg,.trash svg{width:15px;height:15px}
.star:hover{color:var(--ocre);border-color:var(--ink-300)}
.trash:hover{color:var(--brick);border-color:#efd8d5;background:#FBF1F0}
.copy{margin-left:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;font-size:12px;font-weight:500;color:var(--ink-600)}
.copy:hover{background:var(--ink-50);border-color:var(--ink-300)}
.copy svg{width:14px;height:14px}
.copy.ok{color:var(--sage);border-color:#cfe0d4;background:#F3F8F4}
.card.fav{background:var(--ink-600);border-color:var(--ink-600)}
.card.fav h3{color:#fff}.card.fav p{color:var(--ink-200)}
.card.fav .star{color:#fff;border-color:rgba(255,255,255,.24);background:rgba(255,255,255,.08)}
.card.fav .star.on{color:#fff;background:rgba(255,255,255,.18)}
.card.fav .copy{color:#fff;border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
.card.fav .copy:hover{background:rgba(255,255,255,.12)}
.card.fav .trash{color:#fff;border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.06)}
.star.on{color:var(--ocre);border-color:var(--ocre)}
.empty{border:1.5px dashed var(--ink-300);border-radius:14px;padding:40px;text-align:center;color:var(--ink-500);font-size:13.5px}
.empty b{color:var(--ink-800)}

<script>
const KEYS=["promptlib","promptlib.v26","promptlib.v25","promptlib.v24","promptlib.v23"];
const PK=KEYS[0];
const uid=()=>Math.random().toString(36).slice(2,10);
const $=id=>document.getElementById(id);
const PAL=["#5B8266","#C97A1E","#B4443B","#4C5568","#6B7488","#9AA3B5","#B2B3B5","#834E17","#363E50","#9A9DA3"];
function defState(){const ex=uid();return{folders:[{id:"root",name:"Directorio raíz",color:null,parentId:null,order:0},{id:ex,name:"Ejemplos",color:"#5B8266",parentId:"root",order:1}],cards:[{id:uid(),folderId:ex,title:"Ejemplo",desc:"Este es un prompt de ejemplo. Edítalo, arrástralo a una carpeta de la izquierda o márcalo como favorito con la estrella. Pulsa Copiar para llevártelo al portapapeles.",favorite:false,order:0}],selection:{folderId:"root"}};}
function load(){for(const k of KEYS){try{const raw=localStorage.getItem(k);if(raw){const d=JSON.parse(raw);if(k!==PK)localStorage.setItem(PK,raw);return d;}}catch(e){}}return defState();}
let S=load();
function save(){try{localStorage.setItem(PK,JSON.stringify(S));}catch(e){}}
const getFolder=id=>S.folders.find(f=>f.id===id);
function pathFor(id){const p=[];let c=getFolder(id);while(c){p.unshift(c.name);c=c.parentId?getFolder(c.parentId):null;}return "/"+p.join("/");}
function descendants(id){const set=new Set([id]);let added=true;while(added){added=false;for(const f of S.folders){if(f.parentId&&set.has(f.parentId)&&!set.has(f.id)){set.add(f.id);added=true;}}}return set;}
/* ---- Árbol ---- */
function renderTree(){
  const t=$("tree");t.innerHTML="";
  function kids(pid){return S.folders.filter(f=>f.parentId===pid).sort((a,b)=>a.order-b.order);}
  function node(f,depth){
    const wrap=document.createElement("div");
    const h=document.createElement("div");h.className="node-h"+(S.selection.folderId===f.id?" sel":"");
    if(f.id!=="root")h.draggable=true;
    const dot=document.createElement("div");dot.className="dot";if(f.color)dot.style.background=f.color;
    dot.title="Color";dot.onclick=e=>{e.stopPropagation();openPalette(e.clientX,e.clientY,c=>{f.color=c;save();renderTree();});};
    const t2=document.createElement("div");t2.className="node-t";t2.textContent=f.name;
    t2.ondblclick=e=>{e.preventDefault();clearTimeout(treeClickTimer);rename(t2,f);};
    h.appendChild(dot);h.appendChild(t2);
    /* clic simple (con retardo) selecciona; el doble clic lo cancela para renombrar */
    h.onclick=()=>{clearTimeout(treeClickTimer);treeClickTimer=setTimeout(()=>{S.selection.folderId=f.id;save();renderTree();renderCards();},180);};
    /* arrastrar la carpeta para reordenar / anidar */
    h.ondragstart=e=>{if(f.id==="root"){e.preventDefault();return;}dnd.folder=f.id;dnd.card=null;h.classList.add("dragging");if(e.dataTransfer)e.dataTransfer.effectAllowed="move";};
    h.ondragend=()=>{h.classList.remove("dragging");dnd.folder=null;clearDropMarks();};
    /* zona de drop: fichas (dentro) o carpetas (antes/después/dentro) */
    h.ondragover=e=>{
      if(dnd.card){e.preventDefault();h.classList.add("drop");return;}
      if(dnd.folder&&dnd.folder!==f.id){
        if(descendants(dnd.folder).has(f.id))return;
        e.preventDefault();
        const rect=h.getBoundingClientRect();const y=e.clientY-rect.top;let pos;
        if(f.id==="root")pos="into";
        else if(y<rect.height*0.30)pos="before";
        else if(y>rect.height*0.70)pos="after";
        else pos="into";
        h.classList.remove("dh-into","dh-before","dh-after");h.classList.add("dh-"+pos);h.dataset.pos=pos;
      }
    };
    h.ondragleave=()=>{h.classList.remove("drop","dh-into","dh-before","dh-after");};
    h.ondrop=e=>{
      e.preventDefault();
      if(dnd.card){h.classList.remove("drop");const c=S.cards.find(x=>x.id===dnd.card);if(c){c.folderId=f.id;save();renderCards();}dnd.card=null;return;}
      if(dnd.folder){const pos=h.dataset.pos||"into";const dg=dnd.folder;dnd.folder=null;clearDropMarks();moveFolder(dg,f.id,pos);}
    };
    wrap.appendChild(h);
    const ch=kids(f.id);
    if(ch.length){const k=document.createElement("div");k.className="kids";ch.forEach(c=>k.appendChild(node(c,depth+1)));wrap.appendChild(k);}
    return wrap;
  }
  const root=getFolder("root");t.appendChild(node(root,0));
}
function clearDropMarks(){document.querySelectorAll(".node-h").forEach(n=>n.classList.remove("drop","dh-into","dh-before","dh-after"));}
function moveFolder(dragId,targetId,pos){
  if(dragId===targetId)return;
  const drag=getFolder(dragId),target=getFolder(targetId);
  if(!drag||!target)return;
  if(descendants(dragId).has(targetId))return;
  if(target.id==="root"&&pos!=="into")pos="into";
  if(pos==="into"){
    drag.parentId=target.id;
    const sib=S.folders.filter(f=>f.parentId===target.id&&f.id!==dragId).sort((a,b)=>a.order-b.order);
    sib.push(drag);sib.forEach((f,i)=>f.order=i);
  }else{
    const parent=target.parentId;
    drag.parentId=parent;
    const sib=S.folders.filter(f=>f.parentId===parent&&f.id!==dragId).sort((a,b)=>a.order-b.order);
    let idx=sib.findIndex(f=>f.id===targetId);if(idx<0)idx=sib.length;
    sib.splice(pos==="before"?idx:idx+1,0,drag);
    sib.forEach((f,i)=>f.order=i);
  }
  save();renderTree();renderCards();
}
function rename(el,f){const h=el.closest(".node-h");if(h)h.draggable=false;el.contentEditable=true;el.focus();const r=document.createRange();r.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(r);
  const done=()=>{el.contentEditable=false;if(h&&f.id!=="root")h.draggable=true;const v=(el.textContent||"").trim();if(v)f.name=v;else el.textContent=f.name;save();renderTree();renderCards();};
  el.onblur=done;el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();el.blur();}if(e.key==="Escape"){el.textContent=f.name;el.blur();}};}
function addFolderSel(){const pid=S.selection.folderId||"root";const id=uid();const n=S.folders.filter(f=>f.parentId===pid).length;S.folders.push({id,name:"Nueva carpeta",color:PAL[Math.floor(Math.random()*PAL.length)],parentId:pid,order:n});S.selection.folderId=id;save();renderTree();renderCards();}
function delFolderSel(){const id=S.selection.folderId;if(id==="root")return;if(!confirm("¿Eliminar la carpeta y su contenido?"))return;const set=descendants(id);S.folders=S.folders.filter(f=>!set.has(f.id));S.cards=S.cards.filter(c=>!set.has(c.folderId));S.selection.folderId="root";save();renderTree();renderCards();}
/* ---- Fichas ---- */
function renderCards(){
  const g=$("grid");g.innerHTML="";
  const fid=S.selection.folderId||"root";const allowed=descendants(fid);
  const q=($("q").value||"").trim().toLowerCase();
  let list=S.cards.filter(c=>allowed.has(c.folderId)).filter(c=>!q||(c.title||"").toLowerCase().includes(q)||(c.desc||"").toLowerCase().includes(q));
  list.sort((a,b)=>(a.favorite===b.favorite?0:a.favorite?-1:1)||((a.order||0)-(b.order||0)));
  $("count").textContent=list.length+(list.length===1?" ficha":" fichas");
  $("path").textContent=q?('Resultados: "'+($("q").value.trim())+'"'):pathFor(fid);
  if(!list.length){const e=document.createElement("div");e.className="empty";e.style.gridColumn="1/-1";e.innerHTML=q?"Ninguna ficha coincide con la búsqueda.":"Aún no hay fichas en <b>"+getFolder(fid).name+"</b>. Crea la primera con «＋ Nueva ficha».";g.appendChild(e);return;}
  list.forEach(c=>g.appendChild(cardEl(c)));
}
function cardEl(c){
  const d=document.createElement("div");d.className="card"+(c.favorite?" fav":"");d.draggable=true;
  d.ondragstart=()=>{dnd.card=c.id;d.classList.add("drag");};
  d.ondragend=()=>{d.classList.remove("drag");};
  const h=document.createElement("h3");h.textContent=c.title||"Sin título";
  h.ondblclick=()=>editText(h,c,"title");
  const p=document.createElement("p");p.textContent=c.desc||"";
  p.ondblclick=()=>editText(p,c,"desc");
  const row=document.createElement("div");row.className="row";
  const star=document.createElement("button");star.className="star"+(c.favorite?" on":"");star.title="Favorito";
  star.innerHTML='<svg viewBox="0 0 24 24" fill="'+(c.favorite?"currentColor":"none")+'" stroke="currentColor" stroke-width="1.7"><path d="M12 3l2.6 6.3 6.8.5-5.2 4.4 1.6 6.6L12 17.8 6.2 21.3l1.6-6.6L2.6 9.8l6.8-.5z"/></svg>';
  star.onclick=()=>{c.favorite=!c.favorite;save();renderCards();};
  const trash=document.createElement("button");trash.className="trash";trash.title="Eliminar ficha";
  trash.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>';
  trash.onclick=()=>{if(confirm("¿Eliminar esta ficha?")){S.cards=S.cards.filter(x=>x.id!==c.id);save();renderCards();}};
  const copy=document.createElement("button");copy.className="copy";
  copy.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg><span>Copiar</span>';
  copy.onclick=async()=>{try{await navigator.clipboard.writeText(c.desc||"");}catch(e){}copy.classList.add("ok");copy.querySelector("span").textContent="Copiado";copy.querySelector("svg").innerHTML='<path d="M20 6 9 17l-5-5"/>';setTimeout(()=>{copy.classList.remove("ok");copy.querySelector("span").textContent="Copiar";copy.querySelector("svg").innerHTML='<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/>';},1300);};
  row.appendChild(star);row.appendChild(trash);row.appendChild(copy);
  d.appendChild(h);d.appendChild(p);d.appendChild(row);return d;
}
function editText(el,c,key){el.contentEditable=true;el.draggable=false;el.focus();
  const done=()=>{el.contentEditable=false;c[key]=(el.textContent||"").trim();save();renderCards();};
  el.onblur=done;el.onkeydown=e=>{if(e.key==="Enter"&&key==="title"){e.preventDefault();el.blur();}if(e.key==="Escape"){el.blur();}};}
function newCard(){const fid=S.selection.folderId||"root";const n=S.cards.filter(x=>x.folderId===fid).length;const c={id:uid(),folderId:fid,title:"Nueva ficha",desc:"",favorite:false,order:n};S.cards.push(c);save();renderCards();
  setTimeout(()=>{const first=$("grid").querySelector(".card h3");if(first)editText(first,c,"title");},30);}
/* ---- Paleta ---- */
const palette=$("palette");
function openPalette(x,y,pick){palette.innerHTML="";PAL.forEach(col=>{const s=document.createElement("div");s.className="sw";s.style.background=col;s.onclick=()=>{palette.style.display="none";pick(col);};palette.appendChild(s);});palette.style.left=(x+6)+"px";palette.style.top=(y+6)+"px";palette.style.display="flex";
  const close=e=>{if(!palette.contains(e.target)){palette.style.display="none";document.removeEventListener("mousedown",close);}};setTimeout(()=>document.addEventListener("mousedown",close),0);}
/* ---- DnD state ---- */
const dnd={card:null,folder:null};let treeClickTimer=null;
/* ---- Import / Export ---- */
$("exportBtn").onclick=()=>{const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="biblioteca-prompts.json";a.click();};
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d&&d.folders&&d.cards){S=d;if(!S.selection)S.selection={folderId:"root"};save();renderTree();renderCards();}else alert("El archivo no tiene el formato esperado.");}catch(err){alert("No se pudo leer el archivo.");}};r.readAsText(f);e.target.value="";};
/* ---- Eventos ---- */
$("newCard").onclick=newCard;$("addFolder").onclick=addFolderSel;$("delFolder").onclick=delFolderSel;
$("q").oninput=renderCards;
renderTree();renderCards();
</script>
</body></html>
